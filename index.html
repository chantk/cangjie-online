<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快快樂樂學倉頡 - 線上網頁版</title>
    <!-- CSS and JS resources for js-dos v7 -->
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.js">
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <style>
        html, body, #dos {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
        }
    </style>
</head>
<body>

    <div id="dos"></div>

    <script>
        // Configure js-dos to point to your zip file
        Dos(document.getElementById("dos"), {
            wdosboxUrl: "https://js-dos.com"
        }).then((runtime) => {
            runtime.bootstrap({
                jsdos: "cangjie.zip",
                // CHANGE 'PLAY.EXE' below to match your game's actual executable filename
                run: ["play.com"] 
            });
        });
    </script>

</body>
</html>
