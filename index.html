<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>快快樂樂學倉頡 - 線上網頁版</title>
    
    <!-- Using stable, working CDN links for js-dos v7 engine -->
    <link rel="stylesheet" href="https://js-dos.com/v7/build/releases/latest/js-dos/js-dos.css">
    <script src="https://js-dos.com/v7/build/releases/latest/js-dos/js-dos.js"></script>
    
    <style>
        html, body, #jsdos {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
        }
    </style>
</head>
<body>

    <!-- Container element for js-dos interface -->
    <div id="jsdos"></div>

    <script>
        // Redirect asset collection to your localized matching origin folder
        emulators.pathPrefix = "js-dos/";

        // Fire the runtime pipeline using your validated bundle archive
        Dos(document.getElementById("jsdos")).run("cangjie.zip").catch((err) => {
            console.error("Initialization failure caught:", err);
        });
    </script>

</body>
</html>
